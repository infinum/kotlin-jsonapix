plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "kotlinx-serialization"
}

apply from: "$rootDir/multiplatform.gradle"
apply from: "$rootDir/detekt.gradle"
apply from: "$rootDir/dokka.gradle"
apply from: "$rootDir/maven-publish.gradle"

ext.mavenPublishProperties = [
        group      : releaseConfig.group,
        version    : releaseConfig.version,
        repository : [
                url     : sonatype.url,
                username: sonatype.username,
                password: sonatype.password
        ],
        name       : "JsonApiX Core",
        description: "JsonApiX Core module",
        url        : "https://github.com/infinum/android-jsonapix",
        scm        : [
                connection: "https://github.com/infinum/android-jsonapix.git",
                url       : "https://github.com/infinum/android-jsonapix"
        ]
]

kotlin {
    sourceSets {
        commonMain {
            dependencies {
                api project(":annotations")
                api packages.kotlin.serialization_core
            }
        }
        // core's own tests are JVM tests, on JUnit 5.
        jvmTest {
            dependencies {
                implementation packages.junit.api
                implementation packages.junit.params
                runtimeOnly packages.junit.engine
                runtimeOnly packages.junit.platform_launcher
            }
        }
    }
}

tasks.named("jvmTest", Test) {
    useJUnitPlatform()
    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
    }
}
