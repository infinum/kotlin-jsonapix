task deployAnnotations(dependsOn: [
        ':annotations:clean',
        ':annotations:publishReleasePublicationToSonatypeMavenCentralRepository'
]) {
    group = "Deploy"
    description = "Deploy module to repositories"
}

task deployCore(dependsOn: [
        ':core:clean',
        ':core:publishReleasePublicationToSonatypeMavenCentralRepository'
]) {
    group = "Deploy"
    description = "Deploy module to repositories"
}

task deployProcessor(dependsOn: [
        ':processor:clean',
        ':processor:publishReleasePublicationToSonatypeMavenCentralRepository'
]) {
    group = "Deploy"
    description = "Deploy module to repositories"
}

task deployProcessorCommon(dependsOn: [
        ':processor-common:clean',
        ':processor-common:publishReleasePublicationToSonatypeMavenCentralRepository'
]) {
    group = "Deploy"
    description = "Deploy module to repositories"
}

task deployRetrofit(dependsOn: [
        ':retrofit:clean',
        ':retrofit:publishReleasePublicationToSonatypeMavenCentralRepository'
]) {
    group = "Deploy"
    description = "Deploy module to repositories"
}

task deployAll(dependsOn: [
        'deployAnnotations',
        'deployCore',
        'deployProcessor',
        'deployProcessorCommon',
        'deployRetrofit',
]) {
    group = "Deploy"
    description = "Deploy all modules to repositories"
}

task deployDebug(dependsOn: [
        ':annotations:clean',
        ':core:clean',
        ':processor:clean',
        ':processor-common:clean',
        ':retrofit:clean',
        ':annotations:publishToMavenLocal',
        ':core:publishToMavenLocal',
        ':processor:publishToMavenLocal',
        ':processor-common:publishToMavenLocal',
        ':retrofit:publishToMavenLocal',
]) {
    group = "Deploy"
    description = "Deploy all modules to Mavel Local repository"
}
