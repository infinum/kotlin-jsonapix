plugins {
    id "java-library"
    id "kotlin"
    id "kotlin-kapt"
}

apply from: "$rootDir/detekt.gradle"
apply from: "$rootDir/dokka.gradle"
apply from: "$rootDir/maven-publish.gradle"

ext.mavenPublishProperties = [
        group      : releaseConfig.group,
        version    : releaseConfig.version,
        artifactId   : "processor",
        repository : [
                url     : sonatype.url,
                username: sonatype.username,
                password: sonatype.password
        ],
        name       : "JsonApiX Processor",
        description: "JsonApiX Processor module",
        url        : "https://github.com/infinum/android-jsonapix",
        scm        : [
                connection: "https://github.com/infinum/android-jsonapix.git",
                url       : "https://github.com/infinum/android-jsonapix"
        ]
]

dependencies {
    implementation packages.kotlin.core
    implementation packages.kotlin.poet
    implementation packages.kotlin.poet_metadata
    implementation packages.kotlin.serialization_core
    implementation project(":annotations")
    // Must be implementation rather than compileOnly, so that processor-common and its runtime
    // dependencies end up on consumers' kapt classpath. See the note in processor-common's build file.
    implementation project(":processor-common")
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
                '-Xopt-in=com.squareup.kotlinpoet.metadata.KotlinPoetMetadataPreview',
                '-Xopt-in=kotlinx.serialization.ExperimentalSerializationApi',
                '-Xexplicit-api=strict'
        ]
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
                '-Xopt-in=com.squareup.kotlinpoet.metadata.KotlinPoetMetadataPreview',
                '-Xexplicit-api=strict'
        ]
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
