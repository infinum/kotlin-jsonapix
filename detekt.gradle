apply plugin: "io.gitlab.arturbosch.detekt"

detekt {
    toolVersion = versions.detekt
    config.setFrom(files("${rootProject.rootDir}/detekt.yml"))
    // A JVM module keeps its sources in src/main, a multiplatform module in src/commonMain.
    source.setFrom(files("src/main/java", "src/main/kotlin", "src/commonMain/kotlin"))
    autoCorrect = true
}

dependencies {
    detektPlugins packages.detekt.formatting
}