buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    apply from: "dependencies.gradle"
    apply from: "maven.gradle"
    apply from: "config.gradle"
    apply from: "deploy.gradle"

    dependencies {
        classpath packages.gradle
        classpath packages.legacy_kapt
        classpath packages.kotlin.plugin
        classpath packages.kotlin.serialization_plugin
        classpath packages.ksp.plugin
        classpath packages.detekt.plugin
        classpath packages.hilt.plugin
        classpath packages.dokka.plugin
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task detektAll(dependsOn: [
        ':annotations:detekt',
        ':core:detekt',
        ':processor:detekt',
        ':processor-common:detekt',
        ':processor-ksp:detekt',
        ':retrofit:detekt',
        ':lint:detekt',
        ':processor-tests:compile:detekt',
        ':processor-tests:kapt:detekt',
        ':processor-tests:ksp:detekt'
]) {
    group = "Verification"
    description = "Run detekt on all modules"
}

task runStaticChecks(dependsOn: [
        ':detektAll',
]) {
    group = "Verification"
    description = "Run static checks on all modules"
}