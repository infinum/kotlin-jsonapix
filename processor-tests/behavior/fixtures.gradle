// Native, JS and Wasm have no classloader resources, so the behavior suite doesn't read its JSON
// fixtures at runtime. This task turns each .json file into a string constant of a generated
// Fixtures object. The .json files stay the source of truth; the generated source isn't checked in.
//
// A module that applies this script adds the task to the Kotlin sources of its tests, test on the
// JVM or commonTest in a multiplatform module, which also makes the tests compile after it:
//
//     kotlin.srcDir(tasks.named("generateBehaviorFixtures"))
//
// A constant is named after its file: the name without ".json", in upper case, with every
// character other than a letter or a digit replaced by "_". person_one_rel.json becomes
// PERSON_ONE_REL.

def fixtureDir = file("$rootDir/processor-tests/behavior/src/test/resources")
def generatedDir = layout.buildDirectory.dir("generated/behaviorFixtures/kotlin")
def fixturesPackage = "com.infinum.jsonapix.processor.behavior"

tasks.register("generateBehaviorFixtures") {
    description = "Generates the Fixtures object of the behavior suite from its JSON fixtures."
    inputs.dir(fixtureDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(generatedDir)

    doLast {
        def fixtures = fixtureDir.listFiles({ it.name.endsWith(".json") } as FileFilter)
            .sort { it.name }
            .collect { file ->
                def name = file.name.replaceFirst(/\.json$/, "").toUpperCase(Locale.ROOT).replaceAll(/[^A-Z0-9]/, "_")
                [name: name, file: file]
            }

        def invalid = fixtures.findAll { !(it.name ==~ /[A-Z_][A-Z0-9_]*/) }
        if (invalid) {
            throw new GradleException("These fixtures don't give a valid constant name, rename them: " +
                invalid.collect { it.file.name }.join(", "))
        }
        def clashes = fixtures.groupBy { it.name }.findAll { it.value.size() > 1 }
        if (clashes) {
            throw new GradleException("These fixtures give the same constant name, rename them: " +
                clashes.collect { name, clashing -> "${clashing*.file*.name.join(" and ")} ($name)" }.join("; "))
        }

        // A regular string literal, so the constant holds the file's exact text: raw strings
        // can't hold every character and don't keep "\r".
        def literal = { String text ->
            '"' + text.collect { String c ->
                switch (c) {
                    case "\\": return "\\\\"
                    case '"': return '\\"'
                    case '$': return '\\$'
                    case "\n": return "\\n"
                    case "\r": return "\\r"
                    case "\t": return "\\t"
                    default: return c < " " ? String.format("\\u%04x", (int) c.charAt(0)) : c
                }
            }.join() + '"'
        }

        def source = new StringBuilder()
        source << "// Generated by the generateBehaviorFixtures task from processor-tests/behavior/src/test/resources.\n"
        source << "// Edit the .json files there instead of this file.\n"
        source << "package $fixturesPackage\n\n"
        source << "internal object Fixtures {\n"
        fixtures.eachWithIndex { fixture, index ->
            if (index > 0) source << "\n"
            // One literal per line of the file, so the generated source stays readable.
            def lines = fixture.file.getText("UTF-8").split(/(?<=\n)/)
            source << "    /** ${fixture.file.name} */\n"
            source << "    const val ${fixture.name} =\n"
            source << lines.collect { "        " + literal(it) }.join(" +\n") << "\n"
        }
        source << "}\n"

        def outputDir = generatedDir.get().asFile
        outputDir.deleteDir()
        def output = new File(outputDir, fixturesPackage.replace(".", "/") + "/Fixtures.kt")
        output.parentFile.mkdirs()
        output.setText(source.toString(), "UTF-8")
    }
}
