plugins {
    id "com.android.application"
    id "kotlinx-serialization"
    id "com.android.legacy-kapt"
    id "dagger.hilt.android.plugin"
}

// The published-artifact smoke test builds the sample from locally published JsonApiX artifacts,
// once per backend. By default the sample uses the project modules with KAPT.
def jsonApiXSource = providers.gradleProperty("jsonApiXSource").getOrElse("project")
def jsonApiXBackend = providers.gradleProperty("jsonApiXBackend").getOrElse("kapt")
if (!(jsonApiXSource in ["project", "maven"])) {
    throw new GradleException("jsonApiXSource must be 'project' or 'maven', not '$jsonApiXSource'")
}
if (!(jsonApiXBackend in ["kapt", "ksp"])) {
    throw new GradleException("jsonApiXBackend must be 'kapt' or 'ksp', not '$jsonApiXBackend'")
}

// Only JsonApiX switches backends. Hilt stays on KAPT either way.
if (jsonApiXBackend == "ksp") {
    apply plugin: "com.google.devtools.ksp"
}

apply from: "$rootDir/detekt.gradle"

android {
    compileSdk buildConfig.compileSdk

    defaultConfig {
        applicationId "com.infinum.jsonapix.sample"
        minSdk buildConfig.minSdk
        targetSdk buildConfig.targetSdk
        versionCode 1
        versionName releaseConfig.version
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.infinum.jsonapix'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

if (jsonApiXSource == "maven") {
    // JsonApiX resolves only from the local Maven repository, so a version that wasn't published
    // there fails resolution instead of falling back to a released one from Maven Central.
    repositories {
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroup releaseConfig.group }
        }
    }
}

// A JsonApiX project module, or in Maven mode its published artifact at the version being built
// rather than the released version in the dependency catalog.
def jsonApiX = { String module ->
    jsonApiXSource == "maven" ? "${releaseConfig.group}:$module:${releaseConfig.version}" : project(":$module")
}

dependencies {
    implementation jsonApiX("core")
    implementation jsonApiX("retrofit")
    lintChecks jsonApiX("lint")
    if (jsonApiXBackend == "ksp") {
        ksp jsonApiX("processor-ksp")
    } else {
        kapt jsonApiX("processor")
    }

    implementation packages.retromock.core
    implementation packages.retrofit.core
    implementation packages.kotlin.core
    implementation packages.kotlin.serialization_core
    implementation packages.androidx.core
    implementation packages.androidx.appcompat
    implementation packages.hilt.core
    implementation packages.lifecycle.runtime
    implementation packages.lifecycle.common
    implementation packages.lifecycle.viewmodel
    implementation packages.activity.core
    implementation packages.fragment.core
    kapt packages.hilt.compiler
    implementation packages.material
}